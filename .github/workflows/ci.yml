name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

defaults:
  run:
    working-directory: nextjs-app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: nextjs-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          JWT_SECRET: ci-build-secret-minimum-32-characters-long
          AUTH_SECRET: ci-build-secret-minimum-32-characters-long
          MONGODB_URI: mongodb://127.0.0.1:27017/docuintel-ci
          OPENAI_API_KEY: sk-ci-placeholder
